import { createFileRoute } from "@tanstack/react-router";
import { ArrowUpRight, Sparkles, TrendingUp, PieChart, Target } from "lucide-react";
import { AppShell } from "@/components/app/AppShell";

export const Route = createFileRoute("/_authenticated/dashboard")({
  component: DashboardPage,
  head: () => ({
    meta: [
      { title: "Dashboard — FOVOZ" },
      { name: "description", content: "Your FOVOZ portfolio overview and market intelligence at a glance." },
    ],
  }),
});

function DashboardPage() {
  return (
    <AppShell>
      <DemoBanner />

      <div className="mt-6 grid gap-4 md:grid-cols-4">
        <MetricCard label="Portfolio value" value="₹4,82,650" change="+2.14% today" positive />
        <MetricCard label="Invested" value="₹4,10,000" change="Across 12 holdings" />
        <MetricCard label="Total returns" value="+₹72,650" change="+17.7% overall" positive />
        <MetricCard label="Goal progress" value="42%" change="Wealth Creation · 2032" />
      </div>

      <div className="mt-6 grid gap-4 lg:grid-cols-3">
        <div className="rounded-2xl border border-border bg-card p-5 lg:col-span-2">
          <div className="flex items-center justify-between">
            <h2 className="font-display text-lg">Portfolio performance</h2>
            <span className="text-xs text-muted-foreground">1M · Simulated</span>
          </div>
          <div className="mt-4 h-56">
            <PerfChart />
          </div>
        </div>

        <div className="rounded-2xl border border-border bg-card p-5">
          <div className="flex items-center gap-2">
            <Sparkles className="h-4 w-4 text-gold" />
            <h2 className="font-display text-lg">For you</h2>
          </div>
          <ul className="mt-4 space-y-3 text-sm">
            <Insight
              tone="warn"
              title="Portfolio is IT-heavy"
              body="46% of your holdings sit in IT. Consider diversifying into other sectors."
            />
            <Insight
              tone="ok"
              title="On track for goal"
              body="You've reached 42% of your 'Wealth Creation' goal — ahead of schedule."
            />
            <Insight
              tone="info"
              title="Volatility above profile"
              body="Your portfolio is 18% more volatile than your stated risk preference."
