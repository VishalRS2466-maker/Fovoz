          </ul>
        </div>
      </div>

      <div className="mt-6 grid gap-4 md:grid-cols-3">
        <QuickCard icon={TrendingUp} title="Explore investments" body="Browse stocks, mutual funds, ETFs and bonds." />
        <QuickCard icon={PieChart} title="Portfolio detail" body="Holdings, allocations, and transaction history." />
        <QuickCard icon={Target} title="Set a goal" body="Emergency fund, home, retirement — you choose." />
      </div>

      <p className="mt-6 text-xs text-muted-foreground">
